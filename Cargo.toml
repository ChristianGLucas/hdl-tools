# Axiom package: christiangeorgelucas/hdl-tools
[package]
name = "service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "service"
path = "service.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde_json = "1"
tree-sitter = "=0.25.10"
tree-sitter-vhdl = "=1.4.0"
tree-sitter-systemverilog = "=0.4.0"

[build-dependencies]
tonic-build = "0.12"
